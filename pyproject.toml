[project]
name = "irpf-assistant"
version = "0.1.0"
description = "Local assistant for IRPF 2026 questions, grounded in the official Receita Federal guide."
readme = "README.md"
# An application, not a library: pinning one Python minor keeps the lockfile simple (ADR 0001).
requires-python = ">=3.12,<3.13"
dependencies = [
    "lancedb>=0.41.0",
    "ollama>=0.6.3",
    "pyarrow>=26.0.1",
    "pymupdf>=2.1",
]

[project.scripts]
irpf-ingest = "irpf_assistant.ingest:main"
irpf-index = "irpf_assistant.index:main"
irpf-search = "irpf_assistant.retrieve:main"
irpf-ask = "irpf_assistant.answer:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = [
    # Raised on import by PyMuPDF's SWIG bindings; nothing to act on in this project.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
